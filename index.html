<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>ديوان عبدالله الزمزمي</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background -->
  <div class="background"></div>
  <div class="background-veil"></div>

  <div class="page">
    <!-- Header -->
    <header class="header">
      <button class="bookmark-btn" id="favBtn" title="إضافة إلى المفضلة" aria-pressed="false">
        <span class="bookmark-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>
        </span>
        <span class="bookmark-label">المفضلة</span>
      </button>

      <h1 class="header-title">
        <span>ديوانُ عبدِاللهِ الزمزمِي</span>
        <svg class="title-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-6 0-12 4-14 12-1 3 0 4 3 3C17 17 21 11 21 5c0-.6-.4-1-1-1Z"/><path d="M5 19c2-4 5-7 9-9"/></svg>
      </h1>

      <button class="menu-button" id="menuBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>فهرس الديوان</span>
      </button>
    </header>

    <!-- Main -->
    <main class="stage">
      <!-- Poem Panel -->
      <section class="poem-panel">
        <h2 id="poemTitle" class="poem-title">—</h2>
        <div class="poem-meta">
          <span class="flourish">﴾</span>
          <span id="poemPage" class="poem-page">—</span>
          <span class="flourish flip">﴾</span>
        </div>

        <div id="poemText" class="poem-text">
          <p class="loading">جارٍ تحميل الديوان…</p>
        </div>

        <span class="mini-flourish">❦</span>

        <button class="pill-btn copy-btn" id="copyPanelBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span>نسخ النص</span>
        </button>
      </section>

      <!-- Index / Sidebar -->
      <aside class="sidebar-right" id="sidebar">
        <div class="sidebar-header">
          <h3>فهرس الديوان</h3>
          <button class="close-btn" id="closeSidebarBtn" aria-label="إغلاق">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="ابحث في القصائد.." class="search-input">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>

        <div class="tabs">
          <button class="tab-btn active" id="tabAll">كل القصائد</button>
          <button class="tab-btn" id="tabFav">المفضلة</button>
        </div>

        <div id="indexList" class="index-list"></div>
      </aside>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button class="pill-btn" id="readBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5Z"/><path d="M17 9c1 1 1 5 0 6"/></svg>
        <span>قراءة القصيدة</span>
      </button>
      <button class="pill-btn" id="shareBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><path d="M8.2 10.8 15.8 6.2M8.2 13.2l7.6 4.6"/></svg>
        <span>مشاركة</span>
      </button>
      <button class="pill-btn" id="copyFooterBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
        <span>نسخ التص</span>
      </button>

      <div class="nav-group">
        <button class="pill-btn nav-btn" id="prevBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          <span>السابق</span>
        </button>
        <span class="page-counter" id="pageCounter">— من —</span>
        <button class="pill-btn nav-btn" id="nextBtn">
          <span>التالي</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <button class="pill-btn" id="decFontBtn">A-</button>
      <button class="pill-btn" id="incFontBtn">A+</button>
      <button class="pill-btn" id="fullscreenBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 1-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
        <span>ملء الشاشة</span>
      </button>
    </footer>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <script src="script.js"></script>
</body>
</html>
