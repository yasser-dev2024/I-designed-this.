<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ديوان عبدالله الزمزمي</title>
  <link rel="stylesheet" href="styles.css?v=20260727-reader-scroll-1">
</head>
<body>
  <!-- Splash Screen (not a page: no hash, no history entry, excluded from pagination/index) -->
  <div id="splashScreen" class="splash">
    <div class="splash-bg"></div>
    <picture class="splash-media">
      <source media="(max-width: 860px)" srcset="reader-poet-mobile.png">
      <img class="splash-photo" src="reader-poet-desktop.png" alt="عبدالله محمد الزمزمي">
    </picture>
    <div class="splash-text">
      <h1 class="splash-name">
        <img class="splash-name-logo" src="poet-name-gold.png" alt="الشاعر عبدالله محمد الزمزمي، رحمه الله">
      </h1>
      <p class="splash-diwan">ديوانُ عبدِاللهِ الزمزمِي</p>
    </div>
    <div class="splash-loader" aria-hidden="true"><span></span><span></span><span></span></div>
    <button class="splash-skip" id="splashSkipBtn" type="button">تخطي</button>
  </div>

  <!-- Background -->
  <div class="background"></div>
  <div class="background-veil"></div>

  <div class="page">
    <!-- Header -->
    <header class="header">
      <button class="bookmark-btn" id="favBtn" title="إضافة إلى المفضلة" aria-pressed="false">
        <span class="bookmark-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>
        </span>
        <span class="bookmark-label">المفضلة</span>
      </button>

      <h1 class="header-title">
        <img class="poet-name-logo" src="poet-name-gold.png" alt="الشاعر عبدالله محمد الزمزمي، رحمه الله">
      </h1>

      <button class="menu-button" id="menuBtn" type="button" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>فهرس الديوان</span>
      </button>
    </header>

    <!-- Main -->
    <main class="stage">
      <!-- Poem Panel -->
      <div class="poem-card-wrap">
        <section class="poem-panel" aria-labelledby="poemTitle">
        <h2 id="poemTitle" class="poem-title">—</h2>
        <div id="sectionLabel" class="section-label"></div>
        <div class="poem-meta">
          <span id="poemPage" class="poem-page">—</span>
        </div>

        <div class="reader-design-credit" id="readerDesignCredit" hidden>
          <span>تصميم</span>
          <strong>ياسر الزمزمي</strong>
        </div>

        <div id="poemText" class="poem-text">
          <p class="loading">جارٍ تحميل الديوان…</p>
        </div>

        <button class="pill-btn copy-btn" id="copyPanelBtn" type="button" aria-label="نسخ نص الصفحة الحالية">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span>نسخ النص</span>
        </button>
        </section>
      </div>

      <!-- Index / Sidebar -->
      <aside class="sidebar-right" id="sidebar" aria-label="فهرس الديوان">
        <div class="sidebar-header">
          <div>
            <span class="sidebar-kicker">تصفّح وابحث</span>
            <h3>فهرس الديوان</h3>
          </div>
          <button class="close-btn" id="closeSidebarBtn" type="button" aria-label="إغلاق الفهرس">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="search-wrap">
          <input type="search" id="searchInput" placeholder="ابحث بكلمة في العنوان أو الأبيات" class="search-input" autocomplete="off" aria-label="البحث في عناوين القصائد وأبياتها">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <button class="search-clear" id="searchClearBtn" type="button" aria-label="مسح البحث" title="مسح البحث">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
          </button>
        </div>

        <div class="tabs">
          <button class="tab-btn active" id="tabAll" type="button">كل القصائد</button>
          <button class="tab-btn" id="tabFav" type="button">المفضلة</button>
        </div>

        <form class="page-jump" id="pageJumpForm">
          <label for="pageJumpInput">انتقال سريع</label>
          <div class="page-jump-controls">
            <input id="pageJumpInput" type="text" inputmode="numeric" pattern="[0-9٠-٩۰-۹]*" placeholder="رقم الصفحة" aria-label="رقم الصفحة">
            <button id="pageJumpBtn" type="submit">انتقال</button>
          </div>
          <div class="page-jump-error" id="pageJumpError" role="alert"></div>
        </form>

        <div class="index-summary">
          <div id="searchStatus" class="search-status" role="status" aria-live="polite"></div>
          <span class="index-hint">اختر عنوانًا للانتقال</span>
        </div>

        <nav id="indexList" class="index-list" aria-label="صفحات الديوان"></nav>
      </aside>
    </main>

    <!-- Footer -->
    <footer class="footer" aria-label="أدوات قارئ الديوان">
      <div class="footer-tools" aria-label="أدوات القصيدة">
        <button class="pill-btn" id="readBtn" type="button" aria-label="قراءة الصفحة صوتيًا" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5Z"/><path d="M17 9c1 1 1 5 0 6"/></svg>
          <span>قراءة القصيدة</span>
        </button>
        <button class="pill-btn" id="shareBtn" type="button" aria-label="مشاركة الصفحة الحالية">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><path d="M8.2 10.8 15.8 6.2M8.2 13.2l7.6 4.6"/></svg>
          <span>مشاركة</span>
        </button>
        <button class="pill-btn" id="copyFooterBtn" type="button" aria-label="نسخ نص الصفحة الحالية">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span>نسخ النص</span>
        </button>
      </div>

      <div class="nav-group">
        <button class="pill-btn nav-btn" id="prevBtn" type="button" aria-label="الصفحة السابقة">
          <span>السابق</span>
        </button>
        <span class="page-counter" id="pageCounter" aria-live="polite" aria-atomic="true">
          <span class="page-counter-label">الصفحة الحالية</span>
          <span class="page-counter-values">
            <span class="page-counter-word">رقم</span>
            <strong id="currentPageNumber">—</strong>
            <span class="page-counter-separator">من</span>
            <strong id="totalPageNumber">—</strong>
          </span>
        </span>
        <button class="pill-btn nav-btn" id="nextBtn" type="button" aria-label="الصفحة التالية">
          <span>التالي</span>
        </button>
      </div>

      <div class="display-tools" aria-label="أدوات العرض">
        <button class="pill-btn" id="decFontBtn" type="button" aria-label="تصغير الخط">A−</button>
        <button class="pill-btn" id="incFontBtn" type="button" aria-label="تكبير الخط">A+</button>
        <button class="pill-btn" id="fullscreenBtn" type="button" aria-label="ملء الشاشة" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 1-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
          <span>ملء الشاشة</span>
        </button>
      </div>
    </footer>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  </div>

  <div class="source-image-viewer" id="sourceImageViewer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sourceImageViewerCaption">
    <button class="source-image-viewer-close" id="sourceImageViewerClose" type="button" aria-label="إغلاق الصورة">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <figure class="source-image-viewer-figure">
      <img id="sourceImageViewerImage" src="" alt="">
      <figcaption id="sourceImageViewerCaption"></figcaption>
    </figure>
  </div>

  <script src="pages-data.js?v=20260726-text-data-force-4"></script>
  <script src="script.js?v=20260727-arabic-kashida-1"></script>
</body>
</html>
